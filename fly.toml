# fly.toml app configuration file generated for neotea on 2026-05-29T14:51:50Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'neotea'
primary_region = 'jnb'

[build]

[env]
  GITEA__database__DB_TYPE = 'sqlite3'
  GITEA__database__PATH = '/data/gitea/gitea.db'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
